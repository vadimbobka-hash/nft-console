<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFT Консоль</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f1115;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .gift-card {
            background: #1c2128;
            border-radius: 16px;
            width: 100%;
            max-width: 340px;
            padding: 16px;
            box-sizing: border-box;
            border: 1px solid #30363d;
            margin-top: 20px;
        }
        .gift-header {
            font-size: 15px;
            font-weight: 600;
            color: #8b949e;
            margin-bottom: 12px;
        }
        .gift-image-container {
            background: linear-gradient(135deg, #2b3b55, #1f2836);
            border-radius: 12px;
            height: 240px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border: 1px solid #38444d;
        }
        .gift-image-container img {
            width: 130px;
            height: 130px;
            object-fit: contain;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.4));
        }
        .show-gift-btn {
            background: rgba(0, 0, 0, 0.3);
            border: none;
            color: #8ab4f8;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-top: 24px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 6px;
        }
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 340px;
            margin-top: 16px;
        }
        .btn {
            background-color: #21262d;
            color: #ffffff;
            border: 1px solid #30363d;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:active {
            background-color: #30363d;
        }
        .btn-primary {
            background-color: #238636;
            border-color: #2ea043;
        }
    </style>
</head>
<body>

    <div class="gift-card">
        <div class="gift-header">Pool Float #185044</div>
        <div class="gift-image-container">
            <!-- Здесь картинка дракончика как на скрине -->
            <svg width="120" height="120" viewBox="0 0 24 24" fill="#3fb950"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            <button class="show-gift-btn">ПОКАЗАТЬ ПОДАРОК</button>
        </div>
    </div>

    <div class="action-buttons">
        <div class="btn" onclick="action('transfer')">Передать NFT @thipks</div>
        <div class="btn btn-primary" onclick="action('confirm')">✅ Я отправил подарки</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function action(type) {
            if (type === 'confirm') {
                tg.sendData(JSON.stringify({ status: 'sent', gift: 'Pool Float #185044' }));
            } else {
                tg.showAlert("Передача инициирована...");
            }
        }
    </script>
</body>
</html>
