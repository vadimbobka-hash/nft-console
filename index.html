<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFT Resale Console</title>
    <!-- Подключаем официальный скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #1f1f1f);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #aaaaaa);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --card-bg: rgba(255, 255, 255, 0.05);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h0, h1 {
            font-size: 20px;
            margin: 0 0 5px 0;
        }
        .subtitle {
            font-size: 14px;
            color: var(--hint-color);
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            max-width: 400px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.2s, background 0.2s;
        }
        .card:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.1);
        }
        .icon {
            font-size: 28px;
            margin-bottom: 8px;
        }
        .card-title {
            font-size: 13px;
            font-weight: 600;
        }
        .action-button {
            margin-top: 24px;
            width: 100%;
            max-width: 400px;
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>⚡ NFT Консоль</h1>
        <div class="subtitle">Управление перепродажей</div>
    </div>

    <div class="grid">
        <div class="card" onclick="triggerAction('Выставить на продажу')">
            <div class="icon">🏷️</div>
            <div class="card-title">Выставить на продажу</div>
        </div>
        <div class="card" onclick="triggerAction('Сделать предложение')">
            <div class="icon">💎</div>
            <div class="card-title">Сделать предложение</div>
        </div>
        <div class="card" onclick="triggerAction('Посмотреть коллекцию')">
            <div class="icon">🖼️</div>
            <div class="card-title">Коллекция</div>
        </div>
        <div class="card" onclick="triggerAction('Быстрая отправка')">
            <div class="icon">🚀</div>
            <div class="card-title">Быстрая отправка</div>
        </div>
    </div>

    <button class="action-button" onclick="triggerAction('Главное действие')">Открыть кошелек / Баланс</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        function triggerAction(actionName) {
            // Отправляем данные обратно в чат с ботом или просто вибрируем
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
            
            // Отправляем выбранное действие в чат (если открыто через бота)
            tg.sendData(JSON.stringify({ action: actionName }));
            
            // Или просто закрываем приложение / показываем уведомление
            tg.showAlert(`Выбрано: ${actionName}`);
        }
    </script>
</body>
</html>
